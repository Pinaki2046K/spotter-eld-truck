# Fallback host, used only if Railway's monthly credit runs out mid-review.
# min_machines_running = 1 keeps a warm process, which is the whole point.
app = "spotter-trip-planner"
primary_region = "ord"

[build]

[env]
  PORT = "8080"
  DEBUG = "False"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options.response]
    pristine = true

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health/"

[deploy]
  release_command = "python manage.py migrate --noinput && python manage.py seed_example_trip"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
