[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "trips/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "ARG", "RUF"]
ignore = [
    "E501",    # black owns line length
    "RUF012",  # Django class attributes are not ClassVar
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]  # pytest fixtures are injected by name
